<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1002" viewBox="0 0 760 1002" role="img" aria-label="成长路径：一次尝试如何进入下一次">
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,sans-serif}.t{fill:#edf5ff;font-size:30px;font-weight:700}.s{fill:#a9b9ce;font-size:17px}.h{fill:#edf5ff;font-size:22px;font-weight:650}.b{fill:#c2d0df;font-size:18px}.n{fill:#73e3cc;font-size:19px;font-weight:700}</style>
<rect width="760" height="1002" rx="24" fill="#101d2c"/>
<text class="t" x="34" y="53">成长路径：一次尝试如何进入下一次</text>
